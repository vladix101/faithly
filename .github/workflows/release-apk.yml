# Signed release APK on GitHub's servers, published as the GitHub Release "v<version>" with
# the asset faithly.apk (same result as `npm run build:apk && npm run release` locally).
# Run: Actions → "Release APK" → Run workflow (branch main). Bump expo.version and
# android.versionCode in app.json and add release-notes/v<version>.md first.
# Secrets (Settings → Secrets and variables → Actions): FAITHLY_KEYSTORE_BASE64 (the .jks file
# as base64), FAITHLY_UPLOAD_STORE_PASSWORD, FAITHLY_UPLOAD_KEY_ALIAS, FAITHLY_UPLOAD_KEY_PASSWORD.
name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.FAITHLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "Missing secret FAITHLY_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/faithly-upload.jks"
          echo "FAITHLY_UPLOAD_STORE_FILE=$RUNNER_TEMP/faithly-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          FAITHLY_UPLOAD_STORE_PASSWORD: ${{ secrets.FAITHLY_UPLOAD_STORE_PASSWORD }}
          FAITHLY_UPLOAD_KEY_ALIAS: ${{ secrets.FAITHLY_UPLOAD_KEY_ALIAS }}
          FAITHLY_UPLOAD_KEY_PASSWORD: ${{ secrets.FAITHLY_UPLOAD_KEY_PASSWORD }}
        run: npm run build:apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/faithly-upload.jks"
